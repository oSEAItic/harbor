name: Deploy harbor-gateway

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'docs/**'
      - 'schemas/**'
      - 'sdk/**'
      - 'install.sh'
      - '.goreleaser.yaml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: test
    concurrency: deploy-harbor-gateway   # prevent overlapping deploys
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy -c fly.gateway.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
